# Stats are generated with GITHUB_TOKEN by default (contribution totals include
# private activity when "Include private contributions on my profile" is on).
#
# Optional ACCESS_TOKEN secret: a user PAT (classic: repo + read:user, or
# fine-grained: Contents read on the repos you want included). When valid, the
# language breakdown and "Currently Building" list include private repos.
# An expired ACCESS_TOKEN is ignored; the job falls back to GITHUB_TOKEN.

name: GitHub Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/github-stats.yml"

concurrency:
  group: github-stats
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: pip3 install requests

      - name: Generate stats block
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 .github/scripts/generate_stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update GitHub stats [skip ci]"
          git push
